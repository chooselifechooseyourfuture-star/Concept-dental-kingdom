<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>デンタルキングダム コンセプトムービー v5</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#2a2420;--fg:#f4ecdf;--muted:#c9b9a3;--btn:#f2b632;--btnfg:#2a2420;--btn2:#5a4b3d;--btn2fg:#f4ecdf;--panel:rgba(20,14,10,0.86)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#17120f}}
:root[data-theme="dark"]{--bg:#17120f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Hiragino Sans',sans-serif;overflow:hidden;position:relative}
#wrap{position:absolute;left:50%;top:50%;width:390px;height:844px;margin-left:-195px;margin-top:-422px;transform-origin:center center}
#stage{position:absolute;left:0;top:0;width:390px;height:844px;background:#eadfc3;border-radius:28px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5)}
canvas{position:absolute;left:0;top:0;width:390px;height:844px;touch-action:none;display:block}
#capbar{position:absolute;left:0;top:760px;width:390px;height:84px;background:rgba(20,14,10,0.92);display:flex;align-items:center;gap:6px;padding:0 8px;box-sizing:border-box}
#cap{flex:1 1 auto;min-width:0;font-size:14px;font-weight:800;line-height:1.35;color:var(--fg);white-space:pre-line}
#ctrls{flex:0 0 auto;display:flex;flex-direction:column;gap:4px}
button{font-family:inherit;font-weight:800;font-size:11px;border:0;border-radius:16px;padding:6px 10px;min-height:30px;cursor:pointer;background:var(--btn2);color:var(--btn2fg)}
button.primary{background:var(--btn);color:var(--btnfg)}
#overlay,#menu{position:absolute;left:0;top:0;width:390px;height:760px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;box-sizing:border-box}
#overlay h1{margin:0;font-size:26px;font-weight:800;color:#ffe9b0}
#overlay p,#menu p{margin:0;font-size:13px;color:var(--fg);line-height:1.6;white-space:pre-line}
#overlay .row,#menu .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#overlay button.primary{font-size:17px;padding:12px 26px;min-height:44px}
#menu button{width:300px;min-height:44px;font-size:14px;text-align:left;padding-left:16px}
.hidden{display:none !important}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game" width="390" height="844"></canvas>
    <div id="overlay">
      <h1>大冒険！デンタルキングダム</h1>
      <p>コンセプトムービー v5　約4分
はじめに「なぜこう作ったか」、次に「遊びはこれだけ」、そのあと機能ごとの遊びかた。音が出ます。</p>
      <div class="row"><button class="primary" id="btnStart">▶ 再生する</button></div>
      <div class="row"><button id="btnMenu0">章を選ぶ</button><button id="btnPlay0">パズルを触ってみる</button></div>
      <p style="font-size:11px;color:var(--muted)">絵はすべて仮。カルテの中身は監修前の仮データです</p>
    </div>
    <div id="menu" class="hidden"></div>
    <div id="capbar">
      <div id="cap"></div>
      <div id="ctrls">
        <button id="btnSound">音</button>
        <button id="btnMenu">章</button>
        <button id="btnPlay">触る</button>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';
/* ===================== 定数 ===================== */
var W=390,H=844,GH=760;
var TILE=40,COLS=8,ROWS=10,BX=35,BY=64;
var TEETH_UP=[[3,0],[2,0],[1,1],[0,2],[0,3],[0,4],[0,5],[1,6],[2,7],[3,7]];
var TEETH_LO=[[6,0],[7,0],[8,1],[9,2],[9,3],[9,4],[9,5],[8,6],[7,7],[6,7]];
var GUM=[[1,2],[1,3],[1,4],[1,5],[2,1],[2,6],[3,1],[3,6],[8,2],[8,3],[8,4],[8,5],[7,1],[7,6],[6,1],[6,6]];
var CHEEK=[[0,0],[0,1],[0,6],[0,7],[1,0],[1,7],[9,0],[9,1],[9,6],[9,7],[8,0],[8,7],[4,0],[4,7],[5,0],[5,7]];
var TILES=[];
(function(){
  function has(list,r,c){for(var i=0;i<list.length;i++){if(list[i][0]===r&&list[i][1]===c)return i;}return -1;}
  for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){
    var t={r:r,c:c,type:'tongue',arch:null,ai:-1,x:BX+c*TILE+TILE/2,y:BY+r*TILE+TILE/2};
    var u=has(TEETH_UP,r,c),l=has(TEETH_LO,r,c);
    if(u>=0){t.type='tooth';t.arch='up';t.ai=u;}else if(l>=0){t.type='tooth';t.arch='lo';t.ai=l;}
    else if(has(GUM,r,c)>=0)t.type='gum';else if(has(CHEEK,r,c)>=0)t.type='cheek';
    TILES.push(t);
  }
})();
function tileAt(r,c){if(r<0||c<0||r>=ROWS||c>=COLS)return -1;return r*COLS+c;}
function toothIdx(arch,ai){for(var i=0;i<TILES.length;i++){if(TILES[i].arch===arch&&TILES[i].ai===ai)return i;}return -1;}
var HOME={denta:{x:70,y:492},taru:{x:320,y:492},iru:{x:195,y:492}};
var CUP={top:508,bot:742,xl0:40,xr0:350,xl1:72,xr1:318,water:530};
function cupX(y){var f=(y-CUP.top)/(CUP.bot-CUP.top);return {l:CUP.xl0+(CUP.xl1-CUP.xl0)*f,r:CUP.xr0+(CUP.xr1-CUP.xr0)*f};}
var TYPES={
  fluoride:{name:'フッ素',icon:'drop',who:'t'},stopmed:{name:'とめる薬',icon:'pill',who:'d'},
  anes:{name:'麻酔',icon:'syringe',who:'d'},turbine:{name:'タービン',icon:'drill',who:'d'},cr:{name:'CR',icon:'tooth',who:'d'},light:{name:'照射器',icon:'light',who:'d'},
  nerve:{name:'神経治療',icon:'nerve',who:'d'},silver:{name:'銀歯',icon:'silver',who:'d'},antibio:{name:'抗菌薬',icon:'pill',who:'d'},pain:{name:'痛み止め',icon:'pill',who:'d'},
  brush:{name:'歯ブラシ',icon:'brush',who:'t'},floss:{name:'フロス',icon:'floss',who:'t'},rinse:{name:'洗口剤',icon:'drop',who:'t'},gargle:{name:'うがい',icon:'gargle',who:'t'},
  juice:{name:'ジュース',icon:'cup',who:'i'},sweets:{name:'お菓子',icon:'candy',who:'i'},skip:{name:'サボり',icon:'nobrush',who:'i'}
};
var LINES={caries:{spread:'arch',every:12},gum:{spread:'gum',every:7},mucosa:{spread:'cheek',every:14},force:{spread:'molars',every:10},growth:{spread:'front',every:10}};
var DZ={
  c1:{name:'軽い虫歯',code:'C1',line:'caries',pri:1,karte:['fluoride','stopmed'],next:'c2',evolve:16,on:'tooth'},
  c2:{name:'ひどい虫歯',code:'C2',line:'caries',pri:2,karte:['anes','turbine','cr','light'],next:'c3',evolve:18,on:'tooth'},
  c3:{name:'神経痛',code:'C3',line:'caries',pri:3,karte:['anes','nerve','silver'],next:'lost',evolve:20,on:'tooth'},
  plaque:{name:'プラーク',code:'P',line:'gum',pri:1,karte:['brush','gargle'],next:'gingivitis',evolve:14,on:'gum'},
  gingivitis:{name:'歯肉炎',code:'炎',line:'gum',pri:2,karte:['brush','floss','rinse'],next:'perio',evolve:16,on:'gum'},
  perio:{name:'歯周病',code:'周',line:'gum',pri:3,karte:['anes','antibio','brush','floss'],next:null,evolve:0,on:'gum'},
  stomatitis:{name:'口内炎',code:'口',line:'mucosa',pri:1,karte:['rinse','pain'],next:null,evolve:0,on:'cheek'}
};
var BAD=['juice','sweets','skip'],BLOCK=['brush','fluoride'];
var FONT="'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Hiragino Sans',sans-serif";
var COL={d:'#2f5fbf',t:'#e2508a',i:'#7b3fbf'};

/* ===================== 状態 ===================== */
var S=null;
function reset(mode){
  S={mode:mode,scene:'board',t:0,timeLeft:90,uid:0,score:0,over:false,equip:3,autoSpread:mode==='play',autoEvolve:mode==='play',
     cells:[],bubbles:[],chain:{active:false,kind:null,ids:[]},target:-1,
     ill:{active:false,cell:-1,progress:0,dur:5,ids:[]},
     chars:{denta:{x:HOME.denta.x,y:HOME.denta.y,st:'idle',stT:0},taru:{x:HOME.taru.x,y:HOME.taru.y,st:'idle',stT:0},iru:{x:HOME.iru.x,y:HOME.iru.y,st:'idle',stT:0,scale:1}},
     particles:[],popups:[],events:[],shake:0,flash:0,flashColor:'#f2b632',shields:{},fade:0,
     finger:{x:195,y:600,down:false,visible:false},
     ai:{next:6,refill:1},task:null,gen:null,hint:0,terrShown:80,sc:{},attack:false,arrive:null};
  for(var i=0;i<TILES.length;i++)S.cells.push({state:'ok',dz:null,spawnT:-9,flipT:-9,healT:-9,spreadAt:0,evolveAt:0,pulseT:-9,lit:false});
}
function rand(a,b){return a+Math.random()*(b-a);}
function dist(ax,ay,bx,by){return Math.hypot(ax-bx,ay-by);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function later(sec,fn){S.events.push({at:S.t+sec,fn:fn});}
function terr(){var d=0,i=0;S.cells.forEach(function(c){if(c.state==='ok')d++;else i++;});return {d:d,i:i};}

/* ===================== 音 ===================== */
var AC=null,soundOn=true;
function audioInit(){try{if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();}if(AC.state==='suspended'){AC.resume();}}catch(e){AC=null;}}
function tone(freq,dur,type,vol,slideTo,delay){if(!AC||!soundOn)return;var t0=AC.currentTime+(delay||0);var o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(freq,t0);if(slideTo){o.frequency.exponentialRampToValueAtTime(slideTo,t0+dur);}g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol||0.2,t0+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+dur+0.02);}
function noise(dur,vol,delay){if(!AC||!soundOn)return;var t0=AC.currentTime+(delay||0);var n=Math.floor(AC.sampleRate*dur);var buf=AC.createBuffer(1,n,AC.sampleRate);var d=buf.getChannelData(0);for(var i=0;i<n;i++){d[i]=(Math.random()*2-1)*(1-i/n);}var src=AC.createBufferSource();src.buffer=buf;var g=AC.createGain();g.gain.value=vol||0.15;var f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=1200;src.connect(f);f.connect(g);g.connect(AC.destination);src.start(t0);}
var SFX={
  link:function(n){tone(440*Math.pow(1.19,n),0.13,'triangle',0.25);},
  wrong:function(){tone(200,0.15,'square',0.08,150);},fizzle:function(){tone(320,0.25,'sine',0.12,140);},
  combo:function(n){var f=[523,659,784,1046,1318];for(var i=0;i<Math.min(n+1,5);i++){tone(f[i],0.16,'triangle',0.28,null,i*0.07);}noise(0.35,0.12,n*0.07);tone(1568,0.5,'sine',0.12,null,n*0.07+0.1);},
  swing:function(){noise(0.12,0.18,0);tone(300,0.12,'sine',0.15,900);},growl:function(){tone(120,0.5,'sawtooth',0.18,60);noise(0.2,0.06,0);},
  spread:function(){tone(160,0.3,'sawtooth',0.12,110);},warning:function(){tone(220,0.09,'square',0.1);tone(220,0.09,'square',0.1,null,0.16);},
  evolve:function(){tone(180,0.6,'sawtooth',0.22,55);tone(90,0.6,'square',0.1,45);noise(0.3,0.1,0.1);},
  block:function(){tone(880,0.08,'square',0.18);tone(1320,0.12,'square',0.16,null,0.08);noise(0.15,0.1,0);},
  shield:function(){tone(660,0.3,'sine',0.14,990);tone(990,0.3,'sine',0.1,1320,0.1);},pop:function(){tone(600,0.08,'sine',0.14,900);},
  bloop:function(){tone(300,0.12,'sine',0.12,520);},tick:function(){tone(1200,0.03,'square',0.05);},
  chime:function(){tone(880,0.2,'triangle',0.18);tone(1174,0.25,'triangle',0.16,null,0.12);tone(1568,0.35,'triangle',0.14,null,0.24);},
  win:function(){var f=[523,659,784,1046,784,1046,1318];for(var i=0;i<f.length;i++){tone(f[i],0.22,'triangle',0.24,null,i*0.11);}}
};

/* ===================== 泡（うがいのコップ） ===================== */
function spawnBubble(type,y,xf){
  y=y||CUP.bot-32;var cx=cupX(y);var x=xf!==undefined?cx.l+(cx.r-cx.l)*xf:rand(cx.l+30,cx.r-30);
  var b={id:++S.uid,type:type,x:x,y:y,r:24,born:S.t,phase:rand(0,6.28),linked:false,dead:false,dieT:0,shakeT:-9,scale:0,who:TYPES[type].who,lit:false,vy:-13};
  S.bubbles.push(b);return b;
}
function bubbleById(id){for(var i=0;i<S.bubbles.length;i++){if(S.bubbles[i].id===id)return S.bubbles[i];}return null;}
function killBubble(b,quiet){if(b.dead)return;b.dead=true;b.dieT=S.t;if(!quiet)SFX.pop();}
function hitBubble(x,y){var best=null,bd=1e9;for(var i=0;i<S.bubbles.length;i++){var b=S.bubbles[i];if(b.dead)continue;var d=dist(x,y,b.x,b.y);if(d<b.r+10&&d<bd){bd=d;best=b;}}return best;}
function liveBubbles(){return S.bubbles.filter(function(b){return !b.dead;});}
function hasType(type){return liveBubbles().some(function(b){return b.type===type;});}
function fillCup(types){types.forEach(function(t,i){spawnBubble(t,CUP.bot-40-i*28,0.15+0.7*((i*0.37)%1));});}
function tileHit(x,y){for(var i=0;i<TILES.length;i++){var t=TILES[i];if(Math.abs(x-t.x)<=TILE/2&&Math.abs(y-t.y)<=TILE/2)return i;}return -1;}

/* ===================== 標的・ちりょうカルテ ===================== */
function autoTarget(){
  if(S.target>=0&&S.cells[S.target].state==='sick')return S.target;
  var best=-1,bp=0;for(var i=0;i<TILES.length;i++){var c=S.cells[i];if(c.state==='sick'&&DZ[c.dz].pri>bp){bp=DZ[c.dz].pri;best=i;}}
  S.target=best;return best;
}
function karte(){var ti=autoTarget();if(ti<0)return null;var k=DZ[S.cells[ti].dz].karte;return k.length?k:null;}
function needSeq(){if(S.chain.kind==='block')return BLOCK;return karte();}
function nextNeeded(){var out=[];if(S.chain.active){var seq=needSeq();if(seq&&S.chain.ids.length<seq.length)out.push(seq[S.chain.ids.length]);return out;}var k=karte();if(k)out.push(k[0]);if(S.ill.active)out.push(BLOCK[0]);return out;}
function casterOf(seq){return seq.every(function(t){return TYPES[t].who==='t';})?'taru':'denta';}

/* ===================== 指・鎖 ===================== */
function pointerDown(x,y){
  S.finger.x=x;S.finger.y=y;S.finger.down=true;if(S.over||S.scene!=='board')return;
  var ti=tileHit(x,y);if(ti>=0){if(S.cells[ti].state==='sick'){S.target=ti;S.cells[ti].pulseT=S.t;SFX.pop();}return;}
  var b=hitBubble(x,y);if(!b||b.who==='i')return;
  if(S.ill.active&&b.type===BLOCK[0]){startChain(b,'block');return;}
  var k=karte();if(k&&b.type===k[0]){startChain(b,'karte');return;}
  b.shakeT=S.t;SFX.wrong();
}
function pointerMove(x,y){S.finger.x=x;S.finger.y=y;if(!S.chain.active)return;var b=hitBubble(x,y);if(!b||b.who==='i'||S.chain.ids.indexOf(b.id)>=0)return;var seq=needSeq();if(!seq)return;if(b.type===seq[S.chain.ids.length])addLink(b);}
function pointerUp(){S.finger.down=false;if(!S.chain.active)return;var seq=needSeq();var done=seq&&S.chain.ids.length===seq.length;if(done){if(S.chain.kind==='karte')castHeal();else castBlock();}else fizzle();S.chain={active:false,kind:null,ids:[]};if(S.chars.denta.st==='ready')setChar('denta','idle');if(S.chars.taru.st==='ready')setChar('taru','idle');}
function startChain(b,kind){S.chain={active:true,kind:kind,ids:[b.id]};b.linked=true;SFX.link(0);burst(b.x,b.y,6,COL[b.who],1);var seq=kind==='block'?BLOCK:karte();setChar(casterOf(seq),'ready');}
function addLink(b){S.chain.ids.push(b.id);b.linked=true;SFX.link(S.chain.ids.length-1);burst(b.x,b.y,6,COL[b.who],1);popup(b.x,b.y-38,S.chain.ids.length+'手',16,'#3a2a1a',0.7);}
function fizzle(){S.chain.ids.forEach(function(id){var b=bubbleById(id);if(b)b.linked=false;});SFX.fizzle();}
function castHeal(){
  var ti=autoTarget();if(ti<0)return;var p=TILES[ti],n=S.chain.ids.length,seq=karte()||[],who=casterOf(seq),ch=S.chars[who],cell=S.cells[ti];
  S.chain.ids.forEach(function(id){var b=bubbleById(id);if(!b)return;stream(b.x,b.y,ch.x,ch.y,10,COL[b.who]);killBubble(b,true);});
  SFX.combo(n);
  charCast(who,p.x,p.y,function(){cell.state='ok';cell.dz=null;cell.healT=S.t;cell.flipT=S.t;burst(p.x,p.y,22,'#fff',2);burst(p.x,p.y,12,COL[who==='taru'?'t':'d'],2);var pts=Math.round(100*n*(1+0.1*S.equip));S.score+=pts;popup(p.x,p.y-40,'なおった！ +'+pts,17,'#2f7a2f',1.4);S.shake=0.3;S.flash=0.2;S.flashColor=COL[who==='taru'?'t':'d'];if(S.mode==='play')later(1,refill);});
}
function castBlock(){
  var ci=S.ill.cell,p=TILES[ci];
  S.chain.ids.forEach(function(id){var b=bubbleById(id);if(b){stream(b.x,b.y,S.chars.taru.x,S.chars.taru.y,8,COL.t);killBubble(b,true);}});
  S.ill.ids.forEach(function(id){var b=bubbleById(id);if(b){b.lit=false;burst(b.x,b.y,8,COL.i,1.2);killBubble(b,true);}});
  S.ill.active=false;S.ill.ids=[];
  charCast('taru',p.x,p.y,function(){S.shields[ci]=S.t+8;SFX.shield();burst(p.x,p.y,16,COL.t,1.6);var pts=Math.round(150*(1+0.1*S.equip));S.score+=pts;popup(p.x,p.y-40,'ブロック！',17,'#b0306a',1.4);S.chars.iru.scale=0.7;setChar('iru','wince');});
  SFX.block();S.shake=0.15;
}

/* ===================== 病気・広がり・イル ===================== */
function placeDisease(i,dzId,quiet){
  var c=S.cells[i];if(c.state!=='ok')return false;var d=DZ[dzId],slow=S.mode==='play'?1.6:1;
  c.state='sick';c.dz=dzId;c.spawnT=S.t;c.flipT=S.t;c.spreadAt=S.t+LINES[d.line].every*slow;c.evolveAt=d.evolve?S.t+d.evolve*slow:0;
  var p=TILES[i];burst(p.x,p.y,12,COL.i,1.4);if(!quiet){SFX.growl();S.shake=0.1;setChar('iru','laugh');}return true;
}
function okTile(j){return j>=0&&S.cells[j].state==='ok'&&!(S.shields[j]&&S.shields[j]>S.t);}
function spreadTargets(i){
  var t=TILES[i],c=S.cells[i],d=DZ[c.dz],sp=LINES[d.line].spread,out=[];
  if(sp==='arch'&&t.type==='tooth'){var cand=[];[-1,1].forEach(function(dd){var j=toothIdx(t.arch,t.ai+dd);if(j>=0&&okTile(j))cand.push(j);});if(cand.length)out.push(cand[Math.floor(Math.random()*cand.length)]);}
  else if(sp==='gum'||sp==='cheek'){var want=sp==='gum'?'gum':'cheek';[[0,1],[0,-1],[1,0],[-1,0]].forEach(function(dd){var j=tileAt(t.r+dd[0],t.c+dd[1]);if(j>=0&&TILES[j].type===want&&okTile(j))out.push(j);});}
  else if(sp==='molars'){['up','lo'].forEach(function(a){[0,1,8,9].forEach(function(ai){var j=toothIdx(a,ai);if(okTile(j))out.push(j);});});}
  else if(sp==='front'){[3,4,5,6].forEach(function(ai){var j=toothIdx('up',ai);if(okTile(j))out.push(j);});}
  return out;
}
function spreadFrom(i){
  var c=S.cells[i];if(c.state!=='sick')return [];var tg=spreadTargets(i),p=TILES[i],id=c.dz;

function wait(sec){var t=0;return {update:function(dt){t+=dt;return t>=sec;}};}
function untilIllDone(){return {update:function(){return !S.ill.active;}};}
function fingerTo(getT,dur){var t=0,sx,sy,st=false;return {update:function(dt){if(!st){sx=S.finger.x;sy=S.finger.y;st=true;}t+=dt;var f=Math.min(1,t/dur),e=f<0.5?2*f*f:1-Math.pow(-2*f+2,2)/2;var tg=getT();var x=sx+(tg.x-sx)*e,y=sy+(tg.y-sy)*e;if(S.finger.down)pointerMove(x,y);else{S.finger.x=x;S.finger.y=y;}return f>=1;}};}
function toB(b){return function(){return {x:b.x,y:b.y};};}
function toT(i){var p=TILES[i];return function(){return p;};}
function down(){pointerDown(S.finger.x,S.finger.y);}
function up(){pointerUp();}
function findB(type){return liveBubbles().find(function(b){return b.type===type&&!b.linked;});}
function goScene(name){S.fade=1.2;S.scene=name;S.sc={};S.finger.visible=false;S.particles=[];S.popups=[];S.attack=false;S.arrive=null;}

  yield* title('第7章','けっか','親と歯科医に返す','result');
  goScene('sunday');S.sc.p=0.92;
  setCaption('日曜。今週のパズル、チームの順位、そして「今日わかったこと」。');yield wait(3.4);
  setCaption('親御さんには週報。歯科医からの一言もここに届く。');yield wait(3);
  setCaption('また医院へ。次のカードが待っている。');SFX.win();yield wait(2.4);
  showEnd('大冒険！デンタルキングダム','紙のカードで遊ぶ、歯のパズル。\n治す・鍛える・いたずらする、の3つの遊びで、\n親と友達と学校を巻き込む。');S.gen=null;S.task=null;
}
var CHAPTERS=[['intro','第0章　全体像（なぜこう作ったか）',chIntro],['read','第1章　よみこむ',chRead],['core','第2章　遊びはこれだけ',chCore],['play','第3章　あそぶ（デンタルパズル）',chPlay],['home','第4章　しゅぎょう（親）',chHome],['bad','第5章　わるいこと（友達）',chBad],['team','第6章　チームバトル（学校）',chTeam],['result','第7章　けっか',chResult]];
function* movie(from){for(var i=from||0;i<CHAPTERS.length;i++){yield* CHAPTERS[i][2]();}}
function advance(){var r=S.gen.next();if(r.done){S.task=null;S.gen=null;return;}S.task=r.value;}

/* ===================== 進行 ===================== */
var capEl=null,overlayEl=null,menuEl=null;
function setCaption(s){if(capEl)capEl.textContent=s;S._cap=s;}
function startMovie(from){reset('demo');hideOverlay();hideMenu();S.gen=movie(from);advance();}
function startPlay(){reset('play');hideOverlay();hideMenu();S.scene='board';placeDisease(toothIdx('up',2),'c1',true);S.target=toothIdx('up',2);fillCup(['fluoride','stopmed','brush','anes','floss','turbine','rinse']);setCaption('病気の印をタップ → ちりょうカルテの順に泡をなぞる → 離すと発動。90秒。');S.hint=S.t;}
function endPlay(){S.over=true;var tr=terr();var win=tr.d>=tr.i;if(win)SFX.win();else SFX.evolve();showEnd(win?'勇者デンタの勝ち！':'大魔王イルの勝ち…','デンタ '+tr.d+'　イル '+tr.i+'\nスコア '+S.score+'（装備 ×'+(1+0.1*S.equip).toFixed(1)+'）\n\n早く見つけるほど、治療は短い。');}
function showEnd(title,body){if(!overlayEl)return;overlayEl.innerHTML='';var h=document.createElement('h1');h.textContent=title;var p=document.createElement('p');p.textContent=body;var row=document.createElement('div');row.className='row';var b1=document.createElement('button');b1.className='primary';b1.textContent='もう一度見る';b1.onclick=function(){audioInit();startMovie(0);};var b2=document.createElement('button');b2.textContent='章を選ぶ';b2.onclick=function(){showMenu();};var b3=document.createElement('button');b3.textContent='パズルを触ってみる';b3.onclick=function(){audioInit();startPlay();};row.appendChild(b1);row.appendChild(b2);row.appendChild(b3);overlayEl.appendChild(h);overlayEl.appendChild(p);overlayEl.appendChild(row);overlayEl.classList.remove('hidden');}
function hideOverlay(){if(overlayEl)overlayEl.classList.add('hidden');}
function showMenu(){if(!menuEl)return;menuEl.innerHTML='';var p=document.createElement('p');p.textContent='章を選ぶ（選んだ章から最後まで再生）';menuEl.appendChild(p);CHAPTERS.forEach(function(ch,i){var b=document.createElement('button');b.textContent=(i+1)+'. '+ch[1];b.onclick=function(){audioInit();startMovie(i);};menuEl.appendChild(b);});var c=document.createElement('button');c.className='primary';c.textContent='とじる';c.onclick=function(){hideMenu();};menuEl.appendChild(c);menuEl.classList.remove('hidden');}
function hideMenu(){if(menuEl)menuEl.classList.add('hidden');}

/* ===================== 起動 ===================== */
if(typeof globalThis!=='undefined'&&globalThis.__HEADLESS__){
  globalThis.__engine={reset:reset,update:update,draw:draw,startMovie:function(from){reset('demo');S.gen=movie(from||0);advance();},startPlay:function(){reset('play');S.scene='board';placeDisease(toothIdx('up',2),'c1',true);S.target=toothIdx('up',2);fillCup(['fluoride','stopmed','brush','anes','floss','turbine','rinse']);},state:function(){return S;},pointerDown:pointerDown,pointerMove:pointerMove,pointerUp:pointerUp,DZ:DZ,TILES:TILES,setCaption:setCaption};
}
if(typeof document!=='undefined'){
  var canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
  capEl=document.getElementById('cap');overlayEl=document.getElementById('overlay');menuEl=document.getElementById('menu');
  var wrap=document.getElementById('wrap');
  function fit(){var s=Math.min(window.innerWidth/402,window.innerHeight/860);wrap.style.transform='scale('+s+')';}
  window.addEventListener('resize',fit);fit();
  var dpr=Math.min(2,window.devicePixelRatio||1);canvas.width=W*dpr;canvas.height=H*dpr;
  reset('idle');S.scene='intro';S.sc={title:'大冒険！デンタルキングダム',sub:'なぜ、こう作ったか',hi:'play'};
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(function(){FONT="'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Hiragino Sans',sans-serif";});}
  document.getElementById('btnStart').addEventListener('click',function(){audioInit();startMovie(0);});
  document.getElementById('btnMenu0').addEventListener('click',function(){showMenu();});
  document.getElementById('btnPlay0').addEventListener('click',function(){audioInit();startPlay();});
  document.getElementById('btnMenu').addEventListener('click',function(){showMenu();});
  document.getElementById('btnPlay').addEventListener('click',function(){audioInit();startPlay();});
  var sb=document.getElementById('btnSound');sb.addEventListener('click',function(){soundOn=!soundOn;sb.textContent=soundOn?'音':'消';sb.style.opacity=soundOn?'1':'0.5';});
  function pos(e){var r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
  canvas.addEventListener('pointerdown',function(e){if(S.mode!=='play')return;e.preventDefault();canvas.setPointerCapture(e.pointerId);var p=pos(e);pointerDown(p.x,p.y);});
  canvas.addEventListener('pointermove',function(e){if(S.mode!=='play')return;var p=pos(e);pointerMove(p.x,p.y);});
  canvas.addEventListener('pointerup',function(){if(S.mode!=='play')return;pointerUp();});
  canvas.addEventListener('pointercancel',function(){if(S.mode!=='play')return;pointerUp();});
  var last=performance.now();
  function frame(now){var dt=Math.min(0.05,(now-last)/1000);last=now;update(dt);ctx.setTransform(dpr,0,0,dpr,0,0);draw(ctx);requestAnimationFrame(frame);}
  requestAnimationFrame(frame);
}
})();
