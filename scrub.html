<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>デンタルキングダム みがくモード v19</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#2a2420;--fg:#f4ecdf;--muted:#c9b9a3;--btn:#f2b632;--btnfg:#2a2420;--btn2:#5a4b3d;--btn2fg:#f4ecdf;--panel:rgba(20,14,10,0.86)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#17120f}}
:root[data-theme="dark"]{--bg:#17120f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Hiragino Sans',sans-serif;overflow:hidden;position:relative}
#wrap{position:absolute;left:50%;top:50%;width:390px;height:760px;margin-left:-195px;margin-top:-380px;transform-origin:center center}
#stage{position:absolute;left:0;top:0;width:390px;height:760px;background:#eadfc3;border-radius:28px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5)}
canvas{position:absolute;left:0;top:0;width:390px;height:760px;touch-action:none;display:block}
#capbar{position:absolute;left:0;top:780px;width:390px;height:64px;background:rgba(20,14,10,0.92);display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:0 12px;box-sizing:border-box}
button{font-family:inherit;font-weight:800;font-size:12px;border:0;border-radius:18px;padding:8px 14px;min-height:36px;cursor:pointer;background:var(--btn2);color:var(--btn2fg)}
button.primary{background:var(--btn);color:var(--btnfg)}
#overlay{position:absolute;left:0;top:0;width:390px;height:760px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;box-sizing:border-box}
#overlay h1{margin:0;font-size:24px;font-weight:800;color:#ffe9b0}
#overlay h1.stars{font-size:44px;letter-spacing:4px}
#overlay p{margin:0;font-size:13px;color:var(--fg);line-height:1.6;white-space:pre-line}
#overlay button.primary{font-size:15px;padding:12px 8px;min-height:48px;width:100px;white-space:nowrap}
#overlay button.big{width:240px;font-size:18px;min-height:56px}
#overlay button.small{width:auto;min-width:88px;font-size:12px;min-height:36px;padding:8px 10px;background:#5a4b3d;color:#f4ecdf}
#overlay .row button.primary:nth-child(1){background:#8fd0a0}#overlay .row button.primary:nth-child(2){background:#f2b632}#overlay .row button.primary:nth-child(3){background:#e2508a;color:#fff}
.hidden{display:none !important}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game" width="390" height="760"></canvas>
    <div id="overlay">
      <h1>みがくモード v19</h1>
      <p>① よごれた歯を タップ
② キャラが 道具を くれる
③ 半とうめいの 手の まねを する

90秒。音が出ます。にゅうもんは道具が無限、ふつうは多め、さいきょうはシビア。</p>
      <div class="row" style="display:flex;gap:10px;justify-content:center"><button class="primary" id="btnEasy">にゅうもん</button><button class="primary" id="btnNormal">ふつう</button><button class="primary" id="btnHard">さいきょう</button></div>
      <p style="font-size:11px;color:var(--muted)">試作。絵とカルテは仮</p>
    </div>
    
  </div>
</div>
<script id="dk-trial">
/*
 * dk-trial-kiroku.js — 試遊の記録（端末の中だけ）。デンタルキングダムのパズル版と同じ数え方・同じ見せ方。
 * 2026-10-02。パズル版（App-dental-kingdom の src/logic/save.ts・src/ui/KirokuOverlay.tsx）を、
 * 1つの HTML に貼れる素の JavaScript に書き直したもの。外には何も送らない。名前・年齢などは残さない。
 *
 * 使い方（くわしくは引き継ぎの文書）：
 *   DKTrial.init({ storageKey: 'dental-kingdom.brush-trial', courses: { easy: 'にゅうもん', normal: 'ふつう', hard: 'さいきょう' } })
 *   遊び始めたとき        DKTrial.roundStart('normal')
 *   「もういちど」を押したとき DKTrial.again()            （roundStart より先に呼ぶ）
 *   終わったとき          DKTrial.result('normal', score, stars)
 *   長押しで きろく        DKTrial.attachLongPress(element)
 *   ?kiroku=1 で開くと きろく を出す。?reset=1 で開くと（確かめてから）記録を消す。
 */
(function (global) {
  'use strict';

  var opts = {
    storageKey: 'dental-kingdom.brush-trial',
    weeks: 5, // カレンダーの週の数（今日の週まで）
    days: 14, // 日ごとの記録に並べる日の数
    reopenAfterMin: 30, // 画面を離れて、これだけたってから戻ったら「開いた」に数える（分）
    longPressSec: 2, // 長押しで きろく（秒）
    courses: {}, // コースの名前（キー → 画面に出す名前）
    againLabel: 'もういちど', // 「もう一回」のボタンの名前（画面の言葉に合わせる）
    backLabel: 'ゲームへ',
    // いちばん良かった結果の書き方（rating：星の数など、score：点）
    formatBest: function (rating, score) {
      var stars = '';
      for (var i = 0; i < 3; i++) stars += i < rating ? '★' : '☆';
      return score === null ? stars : stars + '（' + score + 'てん）';
    }
  };

  var TEXT = {
    title: 'きろく',
    note: ['この スマホ・タブレットの なかだけに のこります', 'そとには おくりません'],
    days: function (open, play) { return 'ひらいた ひ ' + open + 'にち・あそんだ ひ ' + play + 'にち'; },
    rounds: function (n) { return 'あそんだ かいすう ' + n + 'かい'; },
    again: function (n) { return '「' + opts.againLabel + '」 ' + n + 'かい'; },
    best: function (r, s) { return 'いちばん よかった ' + opts.formatBest(r, s); },
    course: function (name, n, r) { return r === null ? name + ' ' + n + 'かい' : name + ' ' + n + 'かい（いちばん ' + opts.formatBest(r, null) + '）'; },
    firstDay: function (m, d) { return 'はじめて ひらいた ひ ' + m + '/' + d; },
    weekdays: ['日', '月', '火', '水', '木', '金', '土'],
    calRounds: function (n) { return n + 'かい'; },
    calOpened: 'ひらいた',
    listTitle: 'ひごとの きろく',
    listRow: function (o, r, a) { return 'ひらいた ' + o + '・あそんだ ' + r + 'かい・' + opts.againLabel + ' ' + a + 'かい'; },
    none: 'まだ きろくが ありません',
    resetConfirm: 'この端末の きろく（開いた日・遊んだ回数 など）を消します。よろしいですか？'
  };

  // ───────── 記録の計算（純粋関数。テストできるように _logic で出す） ─────────

  var DAY_RE = /^\d{4}-\d{2}-\d{2}$/;

  function emptySave() {
    return { version: 1, firstDay: null, days: {}, bestScore: null, bestRating: null, courses: {} };
  }

  /** 端末の時計の日付（その土地の日付）を YYYY-MM-DD に */
  function dayKey(d) {
    var m = String(d.getMonth() + 1), day = String(d.getDate());
    return d.getFullYear() + '-' + (m.length < 2 ? '0' + m : m) + '-' + (day.length < 2 ? '0' + day : day);
  }

  function count(v) { return typeof v === 'number' && isFinite(v) && v >= 0 ? Math.floor(v) : 0; }
  function maybe(v) { return typeof v === 'number' && isFinite(v) && v >= 0 ? Math.floor(v) : null; }
  function obj(v) { return v && typeof v === 'object' && !Array.isArray(v) ? v : null; }

  /** 保存してある文字から読み直す。壊れている所は捨てる（読めなくても遊べるように） */
  function parseSave(raw) {
    if (!raw) return emptySave();
    var o;
    try { o = obj(JSON.parse(raw)); } catch (e) { return emptySave(); }
    if (!o) return emptySave();
    var s = emptySave();
    var days = obj(o.days) || {};
    Object.keys(days).forEach(function (k) {
      var r = obj(days[k]);
      if (DAY_RE.test(k) && r) s.days[k] = { opens: count(r.opens), rounds: count(r.rounds), again: count(r.again) };
    });
    var courses = obj(o.courses) || {};
    Object.keys(courses).forEach(function (k) {
      var c = obj(courses[k]);
      if (c) s.courses[k] = { rounds: count(c.rounds), bestRating: maybe(c.bestRating) };
    });
    s.firstDay = typeof o.firstDay === 'string' && DAY_RE.test(o.firstDay) ? o.firstDay : null;
    s.bestScore = maybe(o.bestScore);
    s.bestRating = maybe(o.bestRating);
    return s;
  }

  function copy(s) { return parseSave(JSON.stringify(s)); }

  function withDay(s, day, change) {
    var n = copy(s);
    var d = n.days[day] || { opens: 0, rounds: 0, again: 0 };
    n.days[day] = change(d);
    if (!n.firstDay) n.firstDay = day;
    return n;
  }

  function recordOpen(s, day) { return withDay(s, day, function (d) { d.opens++; return d; }); }
  function recordAgain(s, day) { return withDay(s, day, function (d) { d.again++; return d; }); }

  function recordRoundStart(s, day, course) {
    var n = withDay(s, day, function (d) { d.rounds++; return d; });
    var key = String(course || 'default');
    var c = n.courses[key] || { rounds: 0, bestRating: null };
    n.courses[key] = { rounds: c.rounds + 1, bestRating: c.bestRating };
    return n;
  }

  function better(a, b) { return a === null ? b : b === null ? a : Math.max(a, b); }

  function recordResult(s, course, score, rating) {
    var n = copy(s);
    var key = String(course || 'default');
    var c = n.courses[key] || { rounds: 0, bestRating: null };
    n.courses[key] = { rounds: c.rounds, bestRating: better(c.bestRating, maybe(rating)) };
    n.bestScore = better(n.bestScore, maybe(score));
    n.bestRating = better(n.bestRating, maybe(rating));
    return n;
  }

  /** 画面を離れてから戻ったとき「開いた」に数えるか：日付が変わっていれば数える。同じ日なら minMs 以上 離れていたら */
  function countsAsReopen(hiddenAtMs, nowMs, sameDay, minMs) { return !sameDay || nowMs - hiddenAtMs >= minMs; }

  function totals(s) {
    var t = { openDays: 0, playDays: 0, opens: 0, rounds: 0, again: 0 };
    Object.keys(s.days).forEach(function (k) {
      var d = s.days[k];
      if (d.opens > 0 || d.rounds > 0) t.openDays++;
      if (d.rounds > 0) t.playDays++;
      t.opens += d.opens; t.rounds += d.rounds; t.again += d.again;
    });
    return t;
  }

  /** 記録のある日（新しい日から） */
  function recordedDays(s, max) {
    return Object.keys(s.days)
      .filter(function (k) { return s.days[k].opens > 0 || s.days[k].rounds > 0; })
      .sort().reverse().slice(0, max)
      .map(function (k) { return { day: k, record: s.days[k] }; });
  }

  /** カレンダー：今日の週を最後に、weeks 週ぶん（日曜はじまり） */
  function calendarWeeks(today, weeks) {
    var start = new Date(today.getFullYear(), today.getMonth(), today.getDate() - today.getDay() - (weeks - 1) * 7);
    var out = [];
    for (var w = 0; w < weeks; w++) {
      var row = [];
      for (var i = 0; i < 7; i++) row.push(dayKey(new Date(start.getFullYear(), start.getMonth(), start.getDate() + w * 7 + i)));
      out.push(row);
    }
    return out;
  }

  function dayParts(day) {
    var p = day.split('-').map(Number);
    return { month: p[1], date: p[2], weekday: new Date(p[0], p[1] - 1, p[2]).getDay() };
  }

  // ───────── 読み書き（localStorage。保存できなくても遊べる） ─────────

  var save = emptySave();
  function load() { try { return parseSave(global.localStorage.getItem(opts.storageKey)); } catch (e) { return emptySave(); } }
  function store() { try { global.localStorage.setItem(opts.storageKey, JSON.stringify(save)); } catch (e) { /* 遊べる */ } }
  function commit(next) { save = next; store(); }
  function today() { return dayKey(new Date()); }

  // ───────── きろく の画面 ─────────

  var overlay = null;
  var CSS =
    '#dk-kiroku{position:fixed;inset:0;z-index:2147483000;overflow-y:auto;background:rgba(20,14,10,.96);color:#f4ecdf;' +
    'font-family:inherit;-webkit-text-size-adjust:100%}' +
    '#dk-kiroku .dk-in{max-width:360px;margin:0 auto;padding:16px 14px 28px;display:flex;flex-direction:column;align-items:center;gap:10px}' +
    '#dk-kiroku h1{margin:6px 0 0;font-size:26px;color:#ffe9b0}' +
    '#dk-kiroku .dk-back{align-self:flex-start;font:inherit;font-weight:800;font-size:14px;padding:6px 14px;border-radius:999px;' +
    'border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#f4ecdf;cursor:pointer}' +
    '#dk-kiroku ul.dk-sum{margin:0;padding:10px 14px;list-style:none;width:100%;box-sizing:border-box;font-size:15px;font-weight:800;' +
    'line-height:1.6;background:rgba(255,255,255,.08);border-radius:14px}' +
    '#dk-kiroku ul.dk-sum .sub{font-size:12px;font-weight:400;opacity:.85}' +
    '#dk-kiroku table{width:100%;border-collapse:separate;border-spacing:3px;table-layout:fixed}' +
    '#dk-kiroku th{font-size:11px;font-weight:400;opacity:.75}' +
    '#dk-kiroku th:first-child{color:#ff9a9a}#dk-kiroku th:last-child{color:#9ac4ff}' +
    '#dk-kiroku td{height:38px;padding:2px 0;vertical-align:top;text-align:center;border-radius:8px;background:rgba(255,255,255,.06)}' +
    '#dk-kiroku td.future{opacity:.35}#dk-kiroku td.opened{background:rgba(242,182,50,.25)}' +
    '#dk-kiroku td.played{background:rgba(242,182,50,.85);color:#2a2420}#dk-kiroku td.today{outline:2px solid #fff;outline-offset:-2px}' +
    '#dk-kiroku .d{display:block;font-size:10px;line-height:1.2}#dk-kiroku .c{display:block;font-size:12px;font-weight:800;line-height:1.4}' +
    '#dk-kiroku .o{display:block;font-size:9px;line-height:1.6}' +
    '#dk-kiroku .dk-list{width:100%;text-align:left;font-size:12px}#dk-kiroku .dk-list p{margin:0 0 4px;font-size:12px;opacity:.85}' +
    '#dk-kiroku .dk-list ul{margin:0;padding:0;list-style:none;line-height:1.8}' +
    '#dk-kiroku .dk-list li{display:flex;gap:8px;border-bottom:1px solid rgba(255,255,255,.1)}#dk-kiroku .dk-list b{flex:none;width:70px}' +
    '#dk-kiroku .dk-note{margin:4px 0 0;font-size:11px;opacity:.75;text-align:center}#dk-kiroku .dk-note span{display:block}';

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function courseName(key) { return Object.prototype.hasOwnProperty.call(opts.courses, key) ? opts.courses[key] : key; }

  function build() {
    var root = el('div');
    root.id = 'dk-kiroku';
    root.setAttribute('role', 'dialog');
    var box = el('div', 'dk-in');
    root.appendChild(box);
    var back = el('button', 'dk-back', opts.backLabel);
    back.type = 'button';
    back.onclick = hide;
    box.appendChild(back);
    box.appendChild(el('h1', '', TEXT.title));

    var t = totals(save);
    var sum = el('ul', 'dk-sum');
    sum.appendChild(el('li', '', TEXT.days(t.openDays, t.playDays)));
    sum.appendChild(el('li', '', TEXT.rounds(t.rounds)));
    sum.appendChild(el('li', '', TEXT.again(t.again)));
    if (save.bestRating !== null || save.bestScore !== null) sum.appendChild(el('li', '', TEXT.best(save.bestRating || 0, save.bestScore)));
    var keys = Object.keys(opts.courses);
    Object.keys(save.courses).forEach(function (k) { if (keys.indexOf(k) < 0) keys.push(k); });
    keys.forEach(function (k) {
      var c = save.courses[k] || { rounds: 0, bestRating: null };
      sum.appendChild(el('li', 'sub', TEXT.course(courseName(k), c.rounds, c.bestRating)));
    });
    if (save.firstDay) {
      var f = dayParts(save.firstDay);
      sum.appendChild(el('li', 'sub', TEXT.firstDay(f.month, f.date)));
    }
    box.appendChild(sum);

    var now = new Date(), todayKey = dayKey(now);
    var table = el('table'), head = el('tr');
    TEXT.weekdays.forEach(function (w) { head.appendChild(el('th', '', w)); });
    var thead = el('thead'); thead.appendChild(head); table.appendChild(thead);
    var tbody = el('tbody');
    calendarWeeks(now, opts.weeks).forEach(function (week, wi) {
      var tr = el('tr');
      week.forEach(function (day, di) {
        var p = dayParts(day), rec = save.days[day] || { opens: 0, rounds: 0 };
        var cls = [rec.rounds > 0 ? 'played' : rec.opens > 0 ? 'opened' : '', day === todayKey ? 'today' : '', day > todayKey ? 'future' : '']
          .filter(Boolean).join(' ');
        var td = el('td', cls);
        td.appendChild(el('span', 'd', p.date === 1 || (wi === 0 && di === 0) ? p.month + '/' + p.date : String(p.date)));
        if (rec.rounds > 0) td.appendChild(el('span', 'c', TEXT.calRounds(rec.rounds)));
        else if (rec.opens > 0) td.appendChild(el('span', 'o', TEXT.calOpened));
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    box.appendChild(table);

    var list = el('div', 'dk-list');
    list.appendChild(el('p', '', TEXT.listTitle));
    var rows = recordedDays(save, opts.days);
    if (rows.length === 0) list.appendChild(el('p', '', TEXT.none));
    else {
      var ul = el('ul');
      rows.forEach(function (x) {
        var p = dayParts(x.day), li = el('li');
        li.appendChild(el('b', '', p.month + '/' + p.date + '（' + TEXT.weekdays[p.weekday] + '）'));
        li.appendChild(el('span', '', TEXT.listRow(x.record.opens, x.record.rounds, x.record.again)));
        ul.appendChild(li);
      });
      list.appendChild(ul);
    }
    box.appendChild(list);
    var note = el('p', 'dk-note');
    TEXT.note.forEach(function (line) { note.appendChild(el('span', '', line)); });
    box.appendChild(note);
    return root;
  }

  function show() {
    if (!document.getElementById('dk-kiroku-style')) {
      var st = el('style', '', CSS);
      st.id = 'dk-kiroku-style';
      document.head.appendChild(st);
    }
    hide();
    overlay = build();
    document.body.appendChild(overlay);
  }

  /** きろくを閉じる。アドレスから ?kiroku を外す（読み込み直さないので「開いた」は増えない） */
  function hide() {
    if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
    overlay = null;
    dropParam('kiroku');
  }

  function dropParam(name) {
    try {
      var url = new URL(global.location.href);
      if (!url.searchParams.has(name)) return;
      url.searchParams.delete(name);
      global.history.replaceState(null, '', url.toString());
    } catch (e) { /* 古いブラウザ：そのまま */ }
  }

  function param(name) {
    try { return new URL(global.location.href).searchParams.get(name); } catch (e) { return null; }
  }

  // ───────── 外から呼ぶもの ─────────

  var started = false;

  function init(o) {
    if (started) return;
    started = true;
    Object.keys(o || {}).forEach(function (k) { opts[k] = o[k]; });
    save = load();
    if (param('reset') === '1') {
      if (global.confirm(TEXT.resetConfirm)) { save = emptySave(); store(); }
      dropParam('reset');
    }
    var viewOnly = param('kiroku') === '1';
    if (viewOnly) show();
    else commit(recordOpen(save, today()));
    // しばらく画面を離れてから戻ったら、もう一度「開いた」に数える（きろく を見ている間は数えない）
    var hiddenAt = null, hiddenDay = '';
    document.addEventListener('visibilitychange', function () {
      var now = new Date();
      if (document.visibilityState === 'hidden') { hiddenAt = now.getTime(); hiddenDay = dayKey(now); return; }
      if (hiddenAt === null) return;
      var reopen = countsAsReopen(hiddenAt, now.getTime(), hiddenDay === dayKey(now), opts.reopenAfterMin * 60000);
      hiddenAt = null;
      if (reopen && !overlay) commit(recordOpen(save, dayKey(now)));
    });
  }

  function attachLongPress(target) {
    if (!target) return;
    var timer = null;
    function cancel() { if (timer !== null) clearTimeout(timer); timer = null; }
    target.addEventListener('pointerdown', function () { cancel(); timer = setTimeout(show, opts.longPressSec * 1000); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (n) { target.addEventListener(n, cancel); });
    target.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  }

  global.DKTrial = {
    init: init,
    roundStart: function (course) { commit(recordRoundStart(save, today(), course)); },
    again: function () { commit(recordAgain(save, today())); },
    result: function (course, score, rating) { commit(recordResult(save, course, score, rating)); },
    attachLongPress: attachLongPress,
    show: show,
    hide: hide,
    data: function () { return copy(save); },
    _logic: {
      emptySave: emptySave, dayKey: dayKey, parseSave: parseSave, recordOpen: recordOpen, recordAgain: recordAgain,
      recordRoundStart: recordRoundStart, recordResult: recordResult, countsAsReopen: countsAsReopen, totals: totals,
      recordedDays: recordedDays, calendarWeeks: calendarWeeks, dayParts: dayParts
    }
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
(function(){
'use strict';
var W=390,H=760,GH=760;
var TS=42,COLS=8,ROWS=10,OX=22,OY=52;
var TEETH_UP=[[3,0],[2,0],[1,1],[0,2],[0,3],[0,4],[0,5],[1,6],[2,7],[3,7]];

var AC=null,soundOn=true;
function audioInit(){try{if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();}if(AC.state==='suspended'){AC.resume();}}catch(e){AC=null;}}
function tone(freq,dur,type,vol,slideTo,delay){if(!AC||!soundOn)return;var t0=AC.currentTime+(delay||0);var o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(freq,t0);if(slideTo){o.frequency.exponentialRampToValueAtTime(slideTo,t0+dur);}g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol||0.2,t0+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+dur+0.02);}
function noise(dur,vol,delay,hp){if(!AC||!soundOn)return;var t0=AC.currentTime+(delay||0);var n=Math.floor(AC.sampleRate*dur);var buf=AC.createBuffer(1,n,AC.sampleRate);var d=buf.getChannelData(0);for(var i=0;i<n;i++){d[i]=(Math.random()*2-1)*(1-i/n);}var src=AC.createBufferSource();src.buffer=buf;var g=AC.createGain();g.gain.value=vol||0.15;var f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp||1200;src.connect(f);f.connect(g);g.connect(AC.destination);src.start(t0);}
var PENTA=[523.25,587.33,659.25,783.99,880,1046.5,1174.7,1318.5];
function chord(notes,dur,vol,delay){for(var i=0;i<notes.length;i++)tone(notes[i],dur,'triangle',vol,null,(delay||0)+i*0.02);}
var drillSrc=null,drillGain=null;
function drillOn(){if(!AC||!soundOn||drillSrc)return;var n=AC.sampleRate*2;var buf=AC.createBuffer(1,n,AC.sampleRate);var d=buf.getChannelData(0);for(var i=0;i<n;i++)d[i]=Math.random()*2-1;drillSrc=AC.createBufferSource();drillSrc.buffer=buf;drillSrc.loop=true;var f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=2400;f.Q.value=1.2;drillGain=AC.createGain();drillGain.gain.value=0.0001;drillSrc.connect(f);f.connect(drillGain);drillGain.connect(AC.destination);drillSrc.start();}
function drillSpeed(v){if(drillGain){var g=clamp(v,0,1)*0.09+0.0001;drillGain.gain.setTargetAtTime(g,AC.currentTime,0.03);}}
function drillOff(){if(drillSrc){try{drillGain.gain.setTargetAtTime(0.0001,AC.currentTime,0.05);var src=drillSrc;setTimeout(function(){try{src.stop();}catch(e){}},150);}catch(e){}drillSrc=null;drillGain=null;}}
var SFX={
  scrub:function(){noise(0.05,0.05,0,1500);},

function addDirt(i,amount,quiet){if(TILES[i].type!=='tooth'||S.lesions[i])return;if(!(S.dirt[i]>0.05))S.dirtBorn[i]=S.t;S.dirt[i]=clamp((S.dirt[i]||0)+amount,0,1);if(!quiet){var t=TILES[i];burst(t.x,t.y,8,'#c9ad3a',1);}}
function placeLesion(i,type,quiet){if(S.lesions[i])return false;S.lesions[i]={type:type,born:S.t,coat:0,floss:0,rinse:0,drill:0,fill:0,cure:0,shakeT:-9,evolveAt:(type==='c1'&&DIFF.evolve)?S.t+DIFF.evolve:0};delete S.dirt[i];var t=TILES[i];burst(t.x,t.y,12,PURPLE,1.4);if(!quiet){SFX.growl();S.shake=0.1;setChar('iru','laugh');}return true;}
function planAttack(phase){var kinds=DIFF.kinds[phase];var kind=kinds[Math.floor(Math.random()*kinds.length)];
  if(kind==='juice'&&S.juice)kind='smear';
  var tiles=[];
  if(kind==='smear'){var arch=Math.random()<0.5?'up':'lo';var list=ARCH[arch];var start=Math.floor(rand(0,list.length-DIFF.smear+1));for(var k=0;k<DIFF.smear;k++){var ti=list[start+k];if(ti>=0&&!S.lesions[ti])tiles.push(ti);}}
  else if(kind==='spread'){var cands=[];for(var d in S.dirt){if(S.dirt[d]>0.5){var t=TILES[d];[toothIdx(t.arch,t.ai-1),toothIdx(t.arch,t.ai+1)].forEach(function(j){if(j>=0&&!S.lesions[j]&&!(S.dirt[j]>0.05))cands.push(j);});}}if(cands.length){tiles=[cands[Math.floor(Math.random()*cands.length)]];}else{return planAttack(phase===0?0:phase);}}
  else if(kind==='c1'||kind==='c2'){var pool=[];for(var u=0;u<TILES.length;u++){if(TILES[u].type==='tooth'&&!S.lesions[u])pool.push(u);}if(pool.length)tiles=[pool[Math.floor(Math.random()*pool.length)]];}
  else if(kind==='gum'){var gp=[];for(var g=0;g<TILES.length;g++){if(TILES[g].type==='gum'&&!S.lesions[g])gp.push(g);}if(gp.length)tiles=[gp[Math.floor(Math.random()*gp.length)]];}
  else if(kind==='juice'){var cand=ARCH.up.filter(function(i){return !S.lesions[i];});if(cand.length>=3){var kk=Math.floor(rand(1,cand.length-2));tiles=[cand[kk-1],cand[kk],cand[kk+1]];}else kind='smear';}
  if(!tiles.length){kind='smear';var arch2=Math.random()<0.5?'up':'lo';var list2=ARCH[arch2];var st2=Math.floor(rand(0,list2.length-2));for(var k2=0;k2<3;k2++){var ti2=list2[st2+k2];if(ti2>=0&&!S.lesions[ti2])tiles.push(ti2);}}
  return {kind:kind,tiles:tiles};}
function doAttack(a){var iru=CHAR.iru;
  if(a.kind==='smear'||a.kind==='spread'){a.tiles.forEach(function(i,k){var t=TILES[i];stream(iru.x,iru.y+10,t.x,t.y,6,'#c9ad3a');later(0.25,function(){addDirt(i,rand(0.6,1),true);});});setChar('iru','laugh');}
  else if(a.kind==='c1'||a.kind==='c2'){a.tiles.forEach(function(i){var t=TILES[i];stream(iru.x,iru.y+10,t.x,t.y,8,PURPLE);later(0.25,function(){delete S.dirt[i];placeLesion(i,a.kind,true);S.shake=0.08;});});setChar('iru','laugh');}
  else if(a.kind==='gum'){a.tiles.forEach(function(i){var t=TILES[i];stream(iru.x,iru.y+10,t.x,t.y,8,'#d63b3b');later(0.25,function(){placeLesion(i,'gum',true);});});setChar('iru','laugh');}
  else if(a.kind==='juice'){S.juice={tiles:a.tiles,until:S.t+(DIFF.juiceWindow||6),born:S.t};S.chars.iru.pour=1;SFX.pour();S.shake=0.1;a.tiles.forEach(function(i){var t=TILES[i];stream(iru.x,iru.y+10,t.x,t.y,10,'#ff8c3c');});}
}
function pourJuice(){var cand=ARCH.up.filter(function(i){return !S.lesions[i];});if(cand.length<3)return;var k=Math.floor(rand(1,cand.length-2));var tiles=[cand[k-1],cand[k],cand[k+1]];S.juice={tiles:tiles,until:S.t+6,born:S.t};S.chars.iru.pour=1;setChar('iru','cast');SFX.pour();S.shake=0.1;tiles.forEach(function(i){var t=TILES[i];stream(CHAR.iru.x,CHAR.iru.y+10,t.x,t.y,10,'#ff8c3c');});}
function problemTool(i){var L=S.lesions[i];if(L&&L.type==='lost')return null;if(S.juice&&S.juice.tiles.indexOf(i)>=0)return 'gargle';if(L){if(L.type==='c1')return 'fluoride';if(L.type==='c2'){if(!S.anes[i])return 'anes';if(L.drill<100)return 'turbine';if(L.fill<100)return 'cr';return 'light';}if(L.type==='gum')return L.floss<3?'floss':'gargle';}if((S.dirt[i]||0)>0.05)return 'brush';return null;}
function treatable(i){var need=problemTool(i);if(!need)return false;if(LIMITED[need]&&S.uses[need]<=0)return false;return true;}
function primaryTarget(){var best=-1,bp=0;for(var i=0;i<TILES.length;i++){var p=0;var L=S.lesions[i];if(!treatable(i))continue;if(S.juice&&S.juice.tiles.indexOf(i)>=0)p=5;else if(L)p=L.type==='c2'?4:L.type==='c1'?3:2;else if((S.dirt[i]||0)>0.05)p=1+(S.dirt[i]||0);if(p>bp){bp=p;best=i;}}return best;}
function usedPopup(i,tool){var t=TILES[i];var left=S.uses[tool];popup(t.x,t.y-52,NAMES[tool]+'を つかった！ あと '+(left===Infinity?'∞':left),11,'#fff',1.6,'#2f5fbf');}
function emptyFeedback(tool){if(S.t-S.emptyT<0.9)return;S.emptyT=S.t;S.emptyTool=tool;SFX.empty();setChar(toolOwner(tool),'shake');S.demo.tile=-1;}
function guideTo(i){var tool=problemTool(i);if(!tool)return;if(LIMITED[tool]&&S.uses[tool]<=0){emptyFeedback(tool);S.target=i;return;}S.target=i;var who=toolOwner(tool);if(S.tool!==tool){S.tool=tool;S.hand={t0:S.t,tile:i,tool:tool,who:who};setChar(who,'reach');SFX.handoff();}S.demo={tile:i,tool:tool,t0:S.t,dim:false,shakeT:-9};S.guide=null;}
function wrongFeedback(i,msg){var L=S.lesions[i];var now=S.t;if(now-S.wrongT<0.9)return;S.wrongT=now;S.wrongTool=S.tool;SFX.wrong();var owner=S.tool?toolOwner(S.tool):null;if(owner)setChar(owner,'shake');if(L)L.shakeT=now;guideTo(i);}
function pain(i){if(S.t-S.painT<1.2)return;S.painT=S.t;SFX.ouch();S.shake=0.12;setChar('denta','wince');var t=TILES[i];burst(t.x,t.y,6,'#d63b3b',1);guideTo(i);}

function brushAround(x,y,moved){var hit=false;for(var i=0;i<TILES.length;i++){var t=TILES[i];if(TILES[i].type!=='tooth'||!(S.dirt[i]>0.05)||S.lesions[i])continue;if(dist(x,y,t.x,t.y)<30){hit=true;S.dirt[i]-=moved*0.012;S.dirtTouch[i]=S.t;if(S.demo.tile===i||S.demo.tool==='brush')S.demo.dim=true;if(Math.random()<0.5)flake(i,'#c9ad3a');if(S.dirt[i]<=0.05){delete S.dirt[i];complete(i,'taru','brush');}}}if(hit&&Math.random()<0.25)SFX.scrub();return hit;}
function applyDrag(i,dx,dy,x,y){var moved=Math.hypot(dx,dy);var tool=S.tool;var L=i>=0?S.lesions[i]:null;
  if(tool==='brush'){if(!brushAround(x,y,moved)&&i>=0&&L){S.acc=(S.acc||0)+moved;if(S.acc>90){S.acc=0;wrongFeedback(i);}}}
  else if(tool==='floss'){if(L&&L.type==='gum'&&L.floss<3){L.acc=(L.acc||0)+Math.abs(dy);L.hacc=(L.hacc||0)+Math.max(0,Math.abs(dx)-Math.abs(dy));if(L.hacc>70){L.hacc=0;S.stats.wrongDir++;S.demo.shakeT=S.t;SFX.wrong();}if(L.acc>26){L.acc=0;L.hacc=0;L.floss++;SFX.floss();flake(i,'#f4a3c0');S.demo.dim=true;popup(TILES[i].x,TILES[i].y-30,'',0,'',0);if(L.floss>=3){chainStep(i,'floss');guideTo(i);}}}else if(i>=0&&(L||S.dirt[i]>0.05)){S.acc=(S.acc||0)+moved;if(S.acc>90){S.acc=0;wrongFeedback(i);}}}
  else if(tool==='turbine'){if(L&&L.type==='c2'){if(!S.anes[i]){pain(i);return;}if(L.drill<100){drillOn();drillSpeed(moved/8);L.drill=Math.min(100,L.drill+moved*0.45);S.demo.dim=true;S.shake=Math.max(S.shake,0.05);if(Math.random()<0.5)flake(i,'#3a3a3a');vibrate(20);if(L.drill>=100&&!L.drillDone){L.drillDone=true;drillOff();chainStep(i,'turbine');guideTo(i);}}}else if(i>=0&&(L||S.dirt[i]>0.05)){S.acc=(S.acc||0)+moved;if(S.acc>90){S.acc=0;wrongFeedback(i);}}}
  else if(i>=0&&(L||S.dirt[i]>0.05)){S.acc=(S.acc||0)+moved;if(S.acc>120){S.acc=0;wrongFeedback(i);}}
}
function applyTap(i){var L=S.lesions[i];var tool=S.tool;var t=TILES[i];
  if(tool==='gargle'){if(S.rinse.cool>S.t){wrongFeedback(i);return;}doRinse();return;}

    var el=90-S.timeLeft;var phase=el<30?0:el<60?1:2;var base=DIFF.beat[phase];if(nProb<=2)base*=DIFF.emptyMul;

    S.ai.spreadNext-=dt;if(S.ai.spreadNext<=0){for(var d in S.dirt){if(S.dirt[d]>0.6){var t=TILES[d];var nb=[toothIdx(t.arch,t.ai-1),toothIdx(t.arch,t.ai+1)].filter(function(j){return j>=0&&!S.lesions[j]&&!(S.dirt[j]>0.05);});if(nb.length){addDirt(nb[Math.floor(Math.random()*nb.length)],0.6);break;}}}S.ai.spreadNext=10;}
    for(var dk in S.dirt){if(S.dirt[dk]>0.05&&S.t-(S.dirtBorn[dk]||S.t)>DIFF.decay){var di=+dk;delete S.dirt[dk];placeLesion(di,'c1',true);var dtt=TILES[di];burst(dtt.x,dtt.y,10,PURPLE,1.2);SFX.evolve();S.shake=0.1;setChar('iru','laugh');}}
    var pain=0;for(var pk in S.lesions){var PL=S.lesions[pk];if(PL.type==='c1')pain+=2;else if(PL.type==='c2')pain+=5;if(PL.type==='c2'&&DIFF.loss&&PL.c2At&&S.t-PL.c2At>DIFF.loss){PL.type='lost';S.lost++;var lt=TILES[pk];burst(lt.x,lt.y,16,'#3a2a1a',1.4);SFX.evolve();S.shake=0.3;setChar('denta','wince');setChar('taru','wince');popup(lt.x,lt.y-30,'ぬけた…',12,'#fff',1.6,'#3a2a1a');if(S.lock===+pk)S.lock=-1;}}
    if(pain>0){S.painAcc+=pain*dt;if(S.painAcc>=1){var sub=Math.floor(S.painAcc);S.painAcc-=sub;S.score=Math.max(0,S.score-sub);}if(S.t-S.painPopT>2){S.painPopT=S.t;for(var qk in S.lesions){var QL=S.lesions[qk];if(QL.type==='c1'||QL.type==='c2'){var qt=TILES[qk];QL.shakeT=S.t;popup(qt.x+14,qt.y-26,QL.type==='c2'?'-10':'-4',11,'#fff',0.9,'#d63b3b');}}}}
    for(var lk in S.lesions){var L=S.lesions[lk];if(L.evolveAt&&S.t>=L.evolveAt&&L.type==='c1'){L.type='c2';L.c2At=S.t;L.evolveAt=0;var tt=TILES[lk];burst(tt.x,tt.y,14,PURPLE,1.6);SFX.evolve();S.shake=0.3;setChar('denta','wince');setChar('iru','laugh');}}
    for(var a in S.anes){if(S.anes[a]<S.t)delete S.anes[a];}

    if(S.demo.tile>=0&&(!problemTool(S.demo.tile)||problemTool(S.demo.tile)!==S.demo.tool||!treatable(S.demo.tile)))S.demo.tile=-1;

function tileHit(x,y){var best=-1,bd=1e9;for(var i=0;i<TILES.length;i++){var t=TILES[i];var d=Math.max(Math.abs(x-t.x),Math.abs(y-t.y));if(d<=TS/2+12&&d<bd){bd=d;best=i;}}return best;}
function toolHit(x,y){var all=TARU_TOOLS.concat(DENTA_TOOLS);for(var i=0;i<all.length;i++){var p=toolPos(all[i]);if(dist(x,y,p.x,p.y)<34)return all[i];}return null;}
function charHit(x,y){if(dist(x,y,S.chars.taru.x,S.chars.taru.y)<34)return 'taru';if(dist(x,y,S.chars.denta.x,S.chars.denta.y)<34)return 'denta';return null;}
function adjY(y){return y-12;}
function isTapTool(t){return t==='anes'||t==='fluoride'||t==='cr'||t==='light'||t==='gargle';}
function setLock(i){if(S.lock!==i){S.lock=i;S.lockT=S.t;}guideTo(i);}
function pointerDown(x,y){y=adjY(y);S.ptr.down=true;S.ptr.x=x;S.ptr.y=y;S.ptr.lastX=x;S.ptr.lastY=y;S.idleT=0;S.acc=0;
  if(dist(x,y+12,348,23)<16){soundOn=!soundOn;return;}if(dist(x,y+12,374,23)<16){audioInit();start();return;}
  if(S.over||!S.started)return;
  var tl=toolHit(x,y);if(tl){S.tool=tl;SFX.tap();S.ptr.tile=-1;setChar(toolOwner(tl),'ready');return;}
  var ch=charHit(x,y);if(ch){if(ch==='denta'&&specialReady()){startSpecial(true);S.ptr.tile=-1;return;}var pt=primaryTarget();if(pt>=0)setLock(pt);S.chars[ch].bounce=1;S.ptr.tile=-1;return;}
  var onBoard=x>OX-10&&x<OX+COLS*TS+10&&y>OY-10&&y<OY+ROWS*TS+10;
  var ti=tileHit(x,y);S.ptr.tile=ti;
  // 病変を触ったらロック（汚れの帯は場所で磨く）
  if(ti>=0&&S.lesions[ti]&&!treatable(ti)){var nt=problemTool(ti);if(nt)emptyFeedback(nt);var tt2=TILES[ti];popup(tt2.x,tt2.y-34,(nt?NAMES[nt]+'が ないよ。':'いまは なおせない。')+'ほかの歯を みがこう',10,'#fff',1.8,'#6b5a3a');S.ptr.tile=-1;return;}
  if(ti>=0&&(S.lesions[ti]||(S.juice&&S.juice.tiles.indexOf(ti)>=0))){setLock(ti);if(S.tool===problemTool(ti)&&isTapTool(S.tool)){S.pendingTap={tile:ti,x:x,y:y};}return;}
  if(ti>=0&&S.dirt[ti]>0.05){if(S.tool!=='brush'){guideTo(ti);}S.target=ti;return;}
  // 空きタイル／盤の外：ロック中なら、そこで動かした操作がロック先に効く
  if(S.lock>=0&&problemTool(S.lock)){var need=problemTool(S.lock);if(S.tool!==need){guideTo(S.lock);return;}if(isTapTool(S.tool)){S.pendingTap={tile:S.lock,x:x,y:y};}return;}
  if(S.tool==='gargle'&&S.rinse.cool<=S.t&&onBoard)S.pendingTap={tile:-1,x:x,y:y,rinse:true};
}
function pointerMove(x,y){y=adjY(y);if(!S.ptr.down)return;var dx=x-S.ptr.lastX,dy=y-S.ptr.lastY;S.ptr.lastX=x;S.ptr.lastY=y;S.ptr.x=x;S.ptr.y=y;if(S.over||!S.started)return;if(S.pendingTap&&dist(x,y,S.pendingTap.x,S.pendingTap.y)>12)S.pendingTap=null;var ti=tileHit(x,y);if(ti!==S.ptr.tile){S.ptr.tile=ti;}

  else if(S.tool==='floss'||S.tool==='turbine'){var tgt=S.lock>=0&&S.lesions[S.lock]?S.lock:ti;applyDrag(tgt,dx,dy,x,y);}}
function pointerUp(){S.ptr.down=false;S.ptr.tile=-1;drillOff();if(S.pendingTap&&S.started&&!S.over){var pt=S.pendingTap;S.pendingTap=null;if(pt.rinse){if(S.rinse.cool<=S.t)doRinse();}else if(problemTool(pt.tile)===S.tool)applyTap(pt.tile);}else S.pendingTap=null;

function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
function txt(ctx,s,x,y,size,color,align,weight,outline){ctx.font=(weight||800)+' '+size+'px '+FONT;ctx.textAlign=align||'center';ctx.textBaseline='middle';if(outline){ctx.lineWidth=4;ctx.strokeStyle=outline;ctx.lineJoin='round';ctx.strokeText(s,x,y);}ctx.fillStyle=color;ctx.fillText(s,x,y);}
function drawTooth(ctx,x,y,sz,fill,stroke){ctx.save();ctx.translate(x,y);var k=sz/24;ctx.scale(k,k);ctx.fillStyle=fill;ctx.strokeStyle=stroke;ctx.lineWidth=1.6/k*1.2;ctx.beginPath();ctx.moveTo(-9,-6);ctx.bezierCurveTo(-5,-13,5,-13,9,-6);ctx.lineTo(10,1);ctx.lineTo(5,11);ctx.quadraticCurveTo(0,3,-5,11);ctx.lineTo(-10,1);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();}
function drawIcon(ctx,icon,cx,cy,size,color){ctx.save();ctx.translate(cx,cy);var s=size/24;ctx.scale(s,s);ctx.fillStyle=color;ctx.strokeStyle=color;ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';
  switch(icon){case 'drop':ctx.beginPath();ctx.moveTo(0,-10);ctx.quadraticCurveTo(8,0,7,5);ctx.arc(0,5,7,0,Math.PI,false);ctx.quadraticCurveTo(-8,0,0,-10);ctx.fill();break;
    case 'syringe':ctx.rotate(-Math.PI/4);rr(ctx,-9,-3,12,6,1.5);ctx.stroke();ctx.beginPath();ctx.moveTo(3,0);ctx.lineTo(11,0);ctx.moveTo(-9,0);ctx.lineTo(-14,0);ctx.moveTo(-14,-3);ctx.lineTo(-14,3);ctx.stroke();break;
    case 'drill':ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-8,-8);ctx.lineTo(1,1);ctx.stroke();ctx.beginPath();ctx.arc(-8,-8,2.6,0,6.29);ctx.stroke();ctx.beginPath();ctx.moveTo(1,1);ctx.lineTo(9,-1);ctx.lineTo(11,9);ctx.lineTo(1,11);ctx.closePath();ctx.fill();break;
    case 'tooth':ctx.beginPath();ctx.moveTo(-8,-6);ctx.bezierCurveTo(-4,-12,4,-12,8,-6);ctx.lineTo(9,0);ctx.lineTo(5,10);ctx.quadraticCurveTo(0,2,-5,10);ctx.lineTo(-9,0);ctx.closePath();ctx.fill();break;
    case 'light':rr(ctx,-11,-3,14,7,2);ctx.fill();ctx.fillRect(3,-2,5,5);ctx.strokeStyle='#e0a41f';ctx.beginPath();ctx.moveTo(10,-5);ctx.lineTo(13,-9);ctx.moveTo(10,0);ctx.lineTo(15,0);ctx.moveTo(10,5);ctx.lineTo(13,9);ctx.stroke();break;
    case 'brush':rr(ctx,-11,-2,15,4,2);ctx.fill();rr(ctx,4,-7,7,13,1.5);ctx.fill();break;
    case 'floss':ctx.beginPath();ctx.arc(-6,0,6,0,6.29);ctx.stroke();ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(11,-6);ctx.stroke();break;
    case 'gargle':ctx.beginPath();ctx.moveTo(-7,-8);ctx.lineTo(7,-8);ctx.lineTo(5,8);ctx.lineTo(-5,8);ctx.closePath();ctx.stroke();ctx.beginPath();ctx.moveTo(-5,0);ctx.quadraticCurveTo(-2,-4,0,0);ctx.quadraticCurveTo(2,4,5,0);ctx.stroke();break;
    case 'cup':ctx.beginPath();ctx.moveTo(-6,-8);ctx.lineTo(6,-8);ctx.lineTo(4,8);ctx.lineTo(-4,8);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(2,-8);ctx.lineTo(6,-14);ctx.stroke();break;}
  ctx.restore();}
function drawDenta(ctx,x,y,sc,ch){var e=S.t-ch.stT,bob=Math.sin(S.t*3)*2-(ch.bounce||0)*Math.abs(Math.sin(S.t*12))*10;var ready=ch.st==='ready'||ch.st==='reach'?1:0,cheer=ch.st==='cheer'?Math.abs(Math.sin(e*8))*8:0,wince=ch.st==='wince',shake=ch.st==='shake'?Math.sin(e*30)*4:0;ctx.save();ctx.translate(x+shake,y+bob-cheer);ctx.scale(sc,sc);
  ctx.fillStyle='#d63b3b';ctx.beginPath();ctx.moveTo(-6,-6);ctx.quadraticCurveTo(-30,10,-26,36);ctx.quadraticCurveTo(-10,28,4,34);ctx.closePath();ctx.fill();ctx.fillStyle=BLUE;rr(ctx,-16,4,32,30,8);ctx.fill();ctx.strokeStyle='#e0a41f';ctx.lineWidth=2;rr(ctx,-16,4,32,30,8);ctx.stroke();ctx.fillStyle='#2a4a8f';rr(ctx,-14,32,11,10,3);ctx.fill();rr(ctx,3,32,11,10,3);ctx.fill();
  ctx.fillStyle='#fff';ctx.strokeStyle='#cfd8e6';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-20,-6);ctx.bezierCurveTo(-22,-30,22,-30,20,-6);ctx.lineTo(18,8);ctx.quadraticCurveTo(10,14,4,8);ctx.quadraticCurveTo(0,2,-4,8);ctx.quadraticCurveTo(-10,14,-18,8);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#e0a41f';ctx.beginPath();ctx.moveTo(-16,-18);ctx.lineTo(-12,-28);ctx.lineTo(-6,-20);ctx.lineTo(0,-30);ctx.lineTo(6,-20);ctx.lineTo(12,-28);ctx.lineTo(16,-18);ctx.closePath();ctx.fill();
  var ey=wince?-6:-8;ctx.fillStyle='#1f3f8f';ctx.beginPath();ctx.ellipse(-7,ey,3,wince?1.5:4,0,0,6.29);ctx.fill();ctx.beginPath();ctx.ellipse(7,ey,3,wince?1.5:4,0,0,6.29);ctx.fill();if(wince){ctx.fillStyle='#4aa3ff';ctx.beginPath();ctx.arc(-13,-12,2.5,0,6.29);ctx.fill();}
  if(ready){ctx.strokeStyle='#1f3f8f';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-11,-15);ctx.lineTo(-4,-12);ctx.moveTo(11,-15);ctx.lineTo(4,-12);ctx.stroke();}
  ctx.fillStyle='#ffb3b3';ctx.beginPath();ctx.arc(-12,-2,2.5,0,6.29);ctx.fill();ctx.beginPath();ctx.arc(12,-2,2.5,0,6.29);ctx.fill();ctx.strokeStyle='#8b2b2b';ctx.lineWidth=2;ctx.beginPath();if(wince){ctx.moveTo(-5,4);ctx.quadraticCurveTo(0,-1,5,4);}else{ctx.moveTo(-4,1);ctx.quadraticCurveTo(0,5,4,1);}ctx.stroke();ctx.restore();}
function drawTaru(ctx,x,y,sc,ch){var e=S.t-ch.stT,bob=Math.sin(S.t*3+1)*2-(ch.bounce||0)*Math.abs(Math.sin(S.t*12))*10;var cheer=ch.st==='cheer'?Math.abs(Math.sin(e*8))*8:0,wince=ch.st==='wince',shake=ch.st==='shake'?Math.sin(e*30)*4:0;ctx.save();ctx.translate(x+shake,y+bob-cheer);ctx.scale(sc,sc);
  ctx.fillStyle=PINK;ctx.beginPath();ctx.moveTo(6,-4);ctx.quadraticCurveTo(30,12,26,36);ctx.quadraticCurveTo(10,30,-4,34);ctx.closePath();ctx.fill();ctx.fillStyle='#8a4a1e';ctx.beginPath();ctx.arc(-16,4,9,0,6.29);ctx.fill();ctx.beginPath();ctx.arc(16,6,9,0,6.29);ctx.fill();
  ctx.fillStyle='#f4a3c0';ctx.beginPath();ctx.moveTo(-12,6);ctx.lineTo(12,6);ctx.lineTo(19,34);ctx.lineTo(-19,34);ctx.closePath();ctx.fill();ctx.fillStyle='#fbe3d3';rr(ctx,-12,34,9,10,3);ctx.fill();rr(ctx,3,34,9,10,3);ctx.fill();
  ctx.fillStyle='#fbe3d3';ctx.beginPath();ctx.arc(0,-8,17,0,6.29);ctx.fill();ctx.fillStyle='#8a4a1e';ctx.beginPath();ctx.arc(0,-16,17,Math.PI,0);ctx.lineTo(17,-10);ctx.quadraticCurveTo(0,-4,-17,-10);ctx.closePath();ctx.fill();
  ctx.fillStyle='#5a3a1a';ctx.beginPath();ctx.ellipse(-6,-8,3,wince?1.5:4,0,0,6.29);ctx.fill();ctx.beginPath();ctx.ellipse(6,-8,3,wince?1.5:4,0,0,6.29);ctx.fill();ctx.fillStyle='#ffb3b3';ctx.beginPath();ctx.arc(-11,-2,2.5,0,6.29);ctx.fill();ctx.beginPath();ctx.arc(11,-2,2.5,0,6.29);ctx.fill();ctx.strokeStyle='#b0306a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-3,1);ctx.quadraticCurveTo(0,4,3,1);ctx.stroke();
  ctx.fillStyle=PINK;ctx.beginPath();ctx.ellipse(0,-22,24,6,0,0,6.29);ctx.fill();ctx.beginPath();ctx.moveTo(-14,-22);ctx.lineTo(4,-52);ctx.lineTo(16,-24);ctx.closePath();ctx.fill();ctx.restore();}
function drawIru(ctx,x,y,sc,ch){var e=S.t-ch.stT;var laugh=ch.st==='laugh'?Math.abs(Math.sin(e*10))*5:0;ctx.save();ctx.translate(x,y-laugh);ctx.scale(sc*ch.scale,sc*ch.scale);ctx.beginPath();for(var a=0;a<9;a++){var ang=a/9*6.283;var r=18+Math.sin(S.t*3+a*1.7)*3;var xx=Math.cos(ang)*r,yy=Math.sin(ang)*r*0.85;if(a===0)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy);}ctx.closePath();ctx.fillStyle='#3b2a4d';ctx.fill();ctx.fillStyle='#ff4d4d';ctx.beginPath();ctx.arc(-6,-3,3,0,6.29);ctx.fill();ctx.beginPath();ctx.arc(6,-3,3,0,6.29);ctx.fill();ctx.strokeStyle='#ff4d4d';ctx.lineWidth=2;ctx.beginPath();if(ch.st==='wince'){ctx.moveTo(-6,7);ctx.quadraticCurveTo(0,3,6,7);}else{ctx.moveTo(-7,4);ctx.quadraticCurveTo(0,10,7,4);}ctx.stroke();
  if(ch.pour>0){ctx.save();ctx.translate(-26,4);ctx.rotate(-0.8*ch.pour);drawIcon(ctx,'cup',0,0,20,'#4a2a6a');ctx.restore();}ctx.restore();}
function drawGerm(ctx,x,y,sc){ctx.save();ctx.translate(x,y+Math.sin(S.t*4+x)*2);ctx.scale(sc,sc);ctx.beginPath();for(var a=0;a<7;a++){var ang=a/7*6.283;var r=8+Math.sin(S.t*5+a)*1.2;if(a===0)ctx.moveTo(Math.cos(ang)*r,Math.sin(ang)*r*0.9);else ctx.lineTo(Math.cos(ang)*r,Math.sin(ang)*r*0.9);}ctx.closePath();ctx.fillStyle='#3b2a4d';ctx.fill();ctx.fillStyle='#ff4d4d';ctx.beginPath();ctx.arc(-3,-1,1.6,0,6.29);ctx.fill();ctx.beginPath();ctx.arc(3,-1,1.6,0,6.29);ctx.fill();ctx.restore();}
function drawBoard(ctx){ctx.fillStyle='#d8b37f';rr(ctx,OX-6,OY-6,COLS*TS+12,ROWS*TS+12,12);ctx.fill();
  for(var i=0;i<TILES.length;i++){var t=TILES[i],L=S.lesions[i];var fill,stroke;if(t.type==='tooth'){fill='#fff';stroke='#6a8fd6';}else if(t.type==='gum'){fill='#f6c6cf';stroke='#e8a3b3';}else if(t.type==='cheek'){fill='#f9dcc8';stroke='#ecc3a8';}else{fill='#e88a94';stroke='#d3707c';}
    if(L&&L.type==='gum'){var red=0.25+0.3*(1-L.floss/3);fill='#f08a96';stroke='#d63b3b';}
    var sh=L&&S.t-L.shakeT<0.3?Math.sin((S.t-L.shakeT)*60)*3:0;
    ctx.fillStyle=fill;ctx.strokeStyle=stroke;ctx.lineWidth=t.type==='tooth'?2:1.5;rr(ctx,t.x-21+sh,t.y-21,42,42,7);ctx.fill();ctx.stroke();
    if(t.type==='tooth'&&!(L&&L.type==='lost'))drawTooth(ctx,t.x+sh,t.y+2,24,'#f4f7fb','#c9d8ee');else if(t.type==='gum'){ctx.fillStyle=L?'rgba(255,255,255,0.5)':'#f0aebb';ctx.beginPath();ctx.arc(t.x,t.y,4,0,6.29);ctx.fill();}else if(t.type==='tongue'){ctx.fillStyle='#f2a5ad';ctx.beginPath();ctx.arc(t.x-8,t.y-6,2,0,6.29);ctx.fill();ctx.beginPath();ctx.arc(t.x+7,t.y+5,2,0,6.29);ctx.fill();}
    if(L&&L.type==='gum'){for(var k=0;k<3;k++){ctx.strokeStyle=k<L.floss?'#fff':'rgba(255,255,255,0.35)';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(t.x-11+k*11,t.y-13);ctx.lineTo(t.x-11+k*11,t.y+13);ctx.stroke();}}
  }
  // 汚れの帯（アーチに沿って連続）
  ['up','lo'].forEach(function(a){var list=ARCH[a];for(var i=0;i<list.length-1;i++){var A=list[i],B=list[i+1];var da=S.dirt[A]||0,db=S.dirt[B]||0;if(da>0.05&&db>0.05){var ta=TILES[A],tb=TILES[B];ctx.strokeStyle='rgba(217,196,90,'+(0.35+0.5*Math.min(da,db))+')';ctx.lineWidth=30*Math.min(1,(da+db));ctx.lineCap='round';ctx.beginPath();ctx.moveTo(ta.x,ta.y);ctx.lineTo(tb.x,tb.y);ctx.stroke();}}});
  for(var d in S.dirt){var v=S.dirt[d];if(v<=0.05)continue;var td=TILES[d];var ageF=clamp((S.t-(S.dirtBorn[d]||S.t))/DIFF.decay,0,1);var dr=Math.round(217-90*ageF),dg=Math.round(196-110*ageF),db=Math.round(90-40*ageF);ctx.fillStyle='rgba('+dr+','+dg+','+db+','+(0.4+0.55*v)+')';if(ageF>0.7){ctx.strokeStyle='rgba(123,63,191,'+(0.5+0.5*Math.sin(S.t*8))+')';ctx.lineWidth=2;ctx.setLineDash([3,3]);rr(ctx,td.x-19,td.y-19,38,38,7);ctx.stroke();ctx.setLineDash([]);}ctx.beginPath();ctx.arc(td.x,td.y,15*Math.sqrt(v),0,6.29);ctx.fill();ctx.fillStyle='rgba(201,173,58,'+(0.6*v)+')';[[-10,-6,6],[8,4,5],[-2,10,4],[9,-9,4]].forEach(function(b){ctx.beginPath();ctx.arc(td.x+b[0],td.y+b[1],b[2]*Math.sqrt(v),0,6.29);ctx.fill();});if(v>0.5)drawGerm(ctx,td.x+8,td.y-12,0.9);if(S.t-(S.dirtTouch[d]||-9)<1.2){var pr=clamp(1-v,0,1);ctx.beginPath();ctx.arc(td.x,td.y,20,-Math.PI/2,-Math.PI/2+pr*6.283);ctx.strokeStyle=GOLD;ctx.lineWidth=4;ctx.lineCap='round';ctx.stroke();if(v<0.3)txt(ctx,'あとすこし！',td.x,td.y-28,10,'#b0306a','center',800,'rgba(255,255,255,0.9)');}}
  // 病変
  for(var lk in S.lesions){var L2=S.lesions[lk],t2=TILES[lk];var untr=(L2.type==='c1'||L2.type==='c2')&&!treatable(lk);if(untr){ctx.fillStyle='rgba(120,110,100,0.85)';ctx.beginPath();ctx.arc(t2.x-14,t2.y-14,7,0,6.29);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(t2.x-17,t2.y-17);ctx.lineTo(t2.x-11,t2.y-11);ctx.moveTo(t2.x-11,t2.y-17);ctx.lineTo(t2.x-17,t2.y-11);ctx.stroke();}
    if(L2.type==='c1'){ctx.fillStyle='#3a2a2a';ctx.beginPath();ctx.arc(t2.x+2,t2.y,5,0,6.29);ctx.fill();if(L2.coat>0){ctx.strokeStyle='rgba(143,208,255,'+(L2.coat/100)+')';ctx.lineWidth=4;ctx.beginPath();ctx.arc(t2.x+2,t2.y,10,0,6.29);ctx.stroke();}if(L2.evolveAt){var f=clamp(1-(L2.evolveAt-S.t)/(DIFF.evolve||30),0,1);ctx.strokeStyle='rgba(123,63,191,0.7)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(t2.x,t2.y,19,-Math.PI/2,-Math.PI/2+f*6.283);ctx.stroke();}}
    else if(L2.type==='lost'){ctx.fillStyle='#6b5a3a';ctx.beginPath();ctx.ellipse(t2.x,t2.y+2,11,13,0,0,6.29);ctx.fill();ctx.fillStyle='#3a2a1a';ctx.beginPath();ctx.ellipse(t2.x,t2.y+2,7,9,0,0,6.29);ctx.fill();}
    else if(L2.type==='c2'){var hr=10;if(DIFF.loss&&L2.c2At){var lf=clamp((S.t-L2.c2At)/DIFF.loss,0,1);ctx.beginPath();ctx.arc(t2.x,t2.y,19,-Math.PI/2,-Math.PI/2+lf*6.283);ctx.strokeStyle='rgba(214,59,59,'+(0.5+0.5*lf)+')';ctx.lineWidth=3;ctx.stroke();}ctx.fillStyle=L2.drill>=100?'#c9d8ee':'#1a1010';ctx.beginPath();ctx.arc(t2.x+1,t2.y+1,hr,0,6.29);ctx.fill();if(L2.drill>0&&L2.drill<100){ctx.fillStyle='#5a4a4a';ctx.beginPath();ctx.arc(t2.x+1,t2.y+1,hr*(1-L2.drill/100),0,6.29);ctx.fill();}if(L2.fill>0){ctx.fillStyle='rgba(255,255,255,'+(0.5+0.5*L2.fill/100)+')';ctx.beginPath();ctx.arc(t2.x+1,t2.y+1,hr*L2.fill/100,0,6.29);ctx.fill();}if(L2.cure>0){ctx.strokeStyle='rgba(159,216,255,'+(L2.cure/100)+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(t2.x+1,t2.y+1,hr+3,0,6.29);ctx.stroke();}if(S.anes[lk]){ctx.strokeStyle='rgba(74,163,255,0.85)';ctx.lineWidth=2.5;ctx.setLineDash([3,3]);rr(ctx,t2.x-19,t2.y-19,38,38,7);ctx.stroke();ctx.setLineDash([]);}}}
  // ジュース
  if(S.juice){var J=S.juice;var pts=J.tiles.map(function(i){return TILES[i];});ctx.strokeStyle='rgba(255,140,60,0.75)';ctx.lineWidth=34;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(var pi=1;pi<pts.length;pi++)ctx.lineTo(pts[pi].x,pts[pi].y);ctx.stroke();for(var qi=0;qi<pts.length;qi++){ctx.fillStyle='#ff8c3c';ctx.beginPath();ctx.arc(pts[qi].x+Math.sin(S.t*3+qi)*6,pts[qi].y-14,3,0,6.29);ctx.fill();}var jf=clamp(1-(J.until-S.t)/(DIFF.juiceWindow||6),0,1);var mid=pts[1];ctx.beginPath();ctx.arc(mid.x,mid.y,26,-Math.PI/2,-Math.PI/2+jf*6.283);ctx.strokeStyle='#ff4d6d';ctx.lineWidth=4;ctx.stroke();}
  // うがいの波
  if(S.rinse.active){var wy=OY+ROWS*TS-(OY+ROWS*TS-OY)*S.rinse.p;ctx.fillStyle='rgba(143,189,224,0.45)';ctx.fillRect(OX-6,wy,COLS*TS+12,OY+ROWS*TS+6-wy);ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();for(var x=OX-6;x<=OX+COLS*TS+6;x+=6){var yy=wy+Math.sin(x*0.08+S.t*6)*4;if(x===OX-6)ctx.moveTo(x,yy);else ctx.lineTo(x,yy);}ctx.stroke();}
  var wv=S.t-S.rinse.wave;if(wv<0.6){ctx.fillStyle='rgba(191,224,245,'+(0.6*(1-wv/0.6))+')';rr(ctx,OX-6,OY-6,COLS*TS+12,ROWS*TS+12,12);ctx.fill();}
}
function gestureSymbol(ctx,tool,x,y,prog){var g=GOLD;ctx.save();ctx.fillStyle='#3a2a1a';rr(ctx,x-24,y+22,48,16,8);ctx.fill();txt(ctx,VERB[tool]||'',x,y+30,10,'#fff');ctx.strokeStyle=g;ctx.fillStyle=g;ctx.lineCap='round';ctx.lineWidth=5;var osc=Math.sin(S.t*6);
  if(tool==='brush'){var o=osc*10;ctx.beginPath();ctx.moveTo(x-24+o,y);ctx.lineTo(x+24+o,y);ctx.stroke();ctx.beginPath();ctx.moveTo(x-24+o,y);ctx.lineTo(x-16+o,y-8);ctx.moveTo(x-24+o,y);ctx.lineTo(x-16+o,y+8);ctx.moveTo(x+24+o,y);ctx.lineTo(x+16+o,y-8);ctx.moveTo(x+24+o,y);ctx.lineTo(x+16+o,y+8);ctx.stroke();}
  else if(tool==='floss'){var o2=osc*10;ctx.beginPath();ctx.moveTo(x,y-24+o2);ctx.lineTo(x,y+24+o2);ctx.stroke();ctx.beginPath();ctx.moveTo(x,y-24+o2);ctx.lineTo(x-8,y-16+o2);ctx.moveTo(x,y-24+o2);ctx.lineTo(x+8,y-16+o2);ctx.moveTo(x,y+24+o2);ctx.lineTo(x-8,y+16+o2);ctx.moveTo(x,y+24+o2);ctx.lineTo(x+8,y+16+o2);ctx.stroke();}
  else if(tool==='anes'){var rp=(S.t*1.5)%1;ctx.beginPath();ctx.arc(x,y,8,0,6.29);ctx.fill();ctx.globalAlpha=1-rp;ctx.beginPath();ctx.arc(x,y,10+rp*20,0,6.29);ctx.lineWidth=3;ctx.stroke();}
  else{var p=prog!==undefined?prog:((S.t*0.8)%1);ctx.beginPath();ctx.arc(x,y,20,0,6.29);ctx.strokeStyle='rgba(242,182,50,0.3)';ctx.lineWidth=6;ctx.stroke();ctx.strokeStyle=g;ctx.beginPath();ctx.arc(x,y,20,-Math.PI/2,-Math.PI/2+p*6.283);ctx.stroke();ctx.beginPath();ctx.arc(x,y,7,0,6.29);ctx.fill();}

  S.particles.forEach(function(p){ctx.globalAlpha=1-p.age/p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,6.29);ctx.fill();});ctx.globalAlpha=1;
  S.popups.forEach(function(q){var f=q.age/q.life;ctx.globalAlpha=f<0.75?1:1-(f-0.75)/0.25;var sc=f<0.15?0.6+f/0.15*0.5:1.1-Math.min(0.1,f*0.1);var tw=q.text.length*q.size*1.05+16;var qx=clamp(q.x,tw/2+6,W-tw/2-6);ctx.save();ctx.translate(qx,q.y-f*26);ctx.scale(sc,sc);if(q.bg){ctx.fillStyle=q.bg;rr(ctx,-tw/2,-q.size*0.8,tw,q.size*1.6,q.size*0.8);ctx.fill();txt(ctx,q.text,0,0,q.size,q.color);}else txt(ctx,q.text,0,0,q.size,q.color,'center',800,'rgba(255,255,255,0.9)');ctx.restore();});ctx.globalAlpha=1;
  drawHUD(ctx);ctx.restore();
  if(S.flash>0){ctx.globalAlpha=S.flash*1.6;ctx.fillStyle=S.flashColor;ctx.fillRect(0,0,W,GH);ctx.globalAlpha=1;}
  ctx.fillStyle='#1a1512';ctx.fillRect(0,GH,W,H-GH);}
/* ---- 進行 ---- */
var overlayEl=null;
function seed(){S.uses={anes:DIFF.uses,cr:DIFF.uses,fluoride:DIFF.uses};var a=ARCH.up,b=ARCH.lo;DIFF.initial.up.forEach(function(i){addDirt(a[i],rand(0.75,0.95),true);});DIFF.initial.lo.forEach(function(i){addDirt(b[i],rand(0.75,0.95),true);});if(DIFF.initial.gum)placeLesion(tileAt(8,3),'gum',true);S.tool=null;S.ai.beatAt=DIFF===DIFFS.easy?6:4;var first=a[DIFF.initial.up[1]||DIFF.initial.up[0]];later(0.6,function(){guideTo(first);});}
function diffKey(){for(var k in DIFFS){if(DIFFS[k]===DIFF)return k;}return 'normal';}
function trial(){return typeof DKTrial!=='undefined'?DKTrial:null;}
function start(diff){if(diff)DIFF=DIFFS[diff]||DIFFS.normal;reset();S.started=true;hideOverlay();seed();if(trial())trial().roundStart(diffKey());}
function showEnd(title,body){if(!overlayEl)return;overlayEl.innerHTML='';var h=document.createElement('h1');h.className='stars';h.textContent=title;var p=document.createElement('p');p.textContent=body;var again=document.createElement('button');again.className='primary big';again.textContent='もういちど（'+DIFF.name+'）';again.onclick=function(){audioInit();if(trial())trial().again();start();};var row=document.createElement('div');row.className='row';row.style.cssText='display:flex;gap:8px;justify-content:center;margin-top:8px';[['easy','にゅうもん'],['normal','ふつう'],['hard','さいきょう']].forEach(function(d){if(DIFFS[d[0]]===DIFF)return;var b=document.createElement('button');b.className='small';b.textContent=d[1]+' にする';b.onclick=function(){audioInit();start(d[0]);};row.appendChild(b);});overlayEl.appendChild(h);overlayEl.appendChild(p);overlayEl.appendChild(again);overlayEl.appendChild(row);overlayEl.classList.remove('hidden');}
function hideOverlay(){if(overlayEl)overlayEl.classList.add('hidden');}
if(typeof globalThis!=='undefined'&&globalThis.__HEADLESS__){globalThis.__engine={reset:reset,update:update,draw:draw,start:function(diff){if(diff)DIFF=DIFFS[diff]||DIFFS.normal;reset();S.started=true;seed();},setDiff:function(d){DIFF=DIFFS[d];},state:function(){return S;},pointerDown:pointerDown,pointerMove:pointerMove,pointerUp:pointerUp,TILES:TILES,toolPos:toolPos,problemTool:problemTool,primaryTarget:primaryTarget};}
if(typeof document!=='undefined'){
  var canvas=document.getElementById('game'),ctx=canvas.getContext('2d');overlayEl=document.getElementById('overlay');var wrap=document.getElementById('wrap');
  function fit(){var vw=window.visualViewport?window.visualViewport.width:window.innerWidth,vh=window.visualViewport?window.visualViewport.height:window.innerHeight;var s=Math.min(vw/394,vh/764);wrap.style.transform='scale('+s+')';}if(window.visualViewport)window.visualViewport.addEventListener('resize',function(){fit();});window.addEventListener('resize',fit);fit();
  var dpr=Math.min(2,window.devicePixelRatio||1);canvas.width=W*dpr;canvas.height=H*dpr;reset();
  document.getElementById('btnEasy').addEventListener('click',function(){audioInit();start('easy');});document.getElementById('btnNormal').addEventListener('click',function(){audioInit();start('normal');});document.getElementById('btnHard').addEventListener('click',function(){audioInit();start('hard');});
  if(trial()){trial().init({storageKey:'dental-kingdom.brush-trial',courses:{easy:'にゅうもん',normal:'ふつう',hard:'さいきょう'}});trial().attachLongPress(overlayEl.querySelector('h1'));}
  function pos(e){var r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
  canvas.addEventListener('pointerdown',function(e){e.preventDefault();canvas.setPointerCapture(e.pointerId);var p=pos(e);pointerDown(p.x,p.y);});
  canvas.addEventListener('pointermove',function(e){var p=pos(e);pointerMove(p.x,p.y);});
  canvas.addEventListener('pointerup',function(){pointerUp();});canvas.addEventListener('pointercancel',function(){pointerUp();});
  var last=performance.now();function frame(now){var dt=Math.min(0.05,(now-last)/1000);last=now;update(dt);ctx.setTransform(dpr,0,0,dpr,0,0);draw(ctx);requestAnimationFrame(frame);}requestAnimationFrame(frame);
}
